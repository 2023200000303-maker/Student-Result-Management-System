<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account - EduResult</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Join the result management portal</p>
        </div>
        <form id="register-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="student@university.edu" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Min. 6 characters" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>
        <p class="auth-footer">Already registered? <a href="login.html">Sign in</a></p>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
