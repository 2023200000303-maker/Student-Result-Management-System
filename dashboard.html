<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Result Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .navbar {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #f8fafc;
        }
        /* Fix subtitle dark text */
        .text-muted {
            color: #94a3b8 !important;
        }
        /* Input Field styling & bright placeholder */
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
        }
        .form-control::placeholder {
            color: #94a3b8;
            opacity: 1;
        }
        .form-control:focus {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        /* Custom Dark Table Styling */
        .table-custom {
            width: 100%;
            color: #f8fafc;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table-custom th {
            color: #94a3b8;
            font-weight: 600;
            padding: 12px;
            border-bottom: 1px solid #334155;
            background-color: transparent;
        }
        .table-custom td {
            padding: 14px 12px;
            border-bottom: 1px solid #334155;
            vertical-align: middle;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="#">EduResult</a>
            <div class="d-flex align-items-center gap-3">
                <span id="user-email-display" class="text-info small"></span>
                <button id="logout-btn" class="btn btn-outline-danger btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-4">

        <!-- Publish Section (Only visible to Admin) -->
        <div id="publish-section" class="card mb-4 p-3" style="display: none;">
            <div class="card-body">
                <h4 class="card-title fw-bold">Publish New Grade</h4>
                <p class="text-muted small">Add a new record to the central database</p>
                
                <form id="add-result-form" class="row g-3 mt-2">
                    <div class="col-md-3">
                        <input type="text" id="student-id" class="form-control" placeholder="Student ID" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="student-name" class="form-control" placeholder="Student Name" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="course-code" class="form-control" placeholder="Course Code" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" id="student-gpa" class="form-control" placeholder="GPA" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">Publish Grade</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Result Directory -->
        <div class="card p-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h4 class="card-title fw-bold mb-0">Result Directory</h4>
                        <p class="text-muted small mb-0">Search and filter published grades</p>
                    </div>
                    <div style="width: 300px;">
                        <input type="text" id="search-input" class="form-control" placeholder="Search ID, Name, or Course...">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table-custom mt-3">
                        <thead>
                            <tr id="table-header-row">
                                <th>STUDENT ID</th>
                                <th>STUDENT NAME</th>
                                <th>COURSE CODE</th>
                                <th>GPA</th>
                                <th id="action-header">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="results-table-body">
                            <!-- Data rows will be injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/results.js"></script>
</body>
</html>
